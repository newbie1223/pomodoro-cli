[project]
name = "pomo-tui"
version = "1.3.0"
description = "Terminal-based Pomodoro timer with TUI and sound notifications"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

authors = [
  { name = "newbie1223" }
]

optional-dependencies = { test = ["pytest>=8.0"] }

[project.scripts]
pomo = "pomodoro_cli.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"